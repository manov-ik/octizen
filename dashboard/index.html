<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octizen - Memory Engine v0.1</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo-container">
            <h1 class="logo-text">Octizen</h1>
          </div>
          <p class="subtitle">Memory Engine v0.1</p>
        </div>

        <nav class="sidebar-nav">
          <a href="#memories" class="nav-item active">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
              />
            </svg>
            Memories
          </a>
          <a href="#logs" class="nav-item">
            <svg
              class="nav-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
              <line x1="9" y1="9" x2="15" y2="9" />
              <line x1="9" y1="13" x2="15" y2="13" />
              <line x1="9" y1="17" x2="13" y2="17" />
            </svg>
            Logs
          </a>
        </nav>

        <div class="sidebar-actions">
          <h3 class="actions-title">Developer Controls</h3>
          <button id="add-dummy-memory-btn" class="btn btn-primary">
            <span class="btn-icon">💡</span>
            Add Dummy Memory
          </button>
          <button id="add-dummy-log-btn" class="btn btn-secondary">
            <span class="btn-icon">📝</span>
            Add Dummy Log
          </button>
          <button id="simulate-button-btn" class="btn btn-secondary">
            <span class="btn-icon">🔴</span>
            Press Phys Button
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="status-indicator">
            <span class="status-dot pulse"></span>
            <span class="status-label">Auto-refreshing</span>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header Grid for stats -->
        <header class="content-header">
          <div>
            <h2>Workspace Hub</h2>
            <p class="description">
              Live dashboard of Octizen local memories and system logs.
            </p>
          </div>
          <div class="stats-panel">
            <div class="stat-card">
              <span class="stat-value" id="memory-count">0</span>
              <span class="stat-label">Total Memories</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="log-count">0</span>
              <span class="stat-label">System Logs</span>
            </div>
          </div>
        </header>

        <!-- Columns Layout -->
        <div class="dashboard-grid">
          <!-- Memories Column -->
          <section class="grid-section" id="memories-section">
            <div class="section-header">
              <h3>Memories Feed</h3>
              <span class="badge badge-info">Newest First</span>
            </div>
            <div class="feed-container" id="memories-feed">
              <!-- Memories will be dynamically injected here -->
              <div class="loading-spinner">Loading memories...</div>
            </div>
          </section>

          <!-- Logs Column -->
          <section class="grid-section" id="logs-section">
            <div class="section-header">
              <h3>System Logs</h3>
              <span class="badge badge-warning">Stream</span>
            </div>
            <div class="logs-container" id="logs-stream">
              <!-- Logs will be dynamically injected here -->
              <div class="loading-spinner">Loading logs...</div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Client-side JavaScript -->
    <script src="/static/script.js"></script>
  </body>
</html>
